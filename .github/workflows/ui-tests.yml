name: UI smoke tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r automation/requirements.txt
      - name: Run smoke suite
        env:
          HEADLESS: "true"
        run: python -m pytest -m smoke
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqa-test-evidence
          path: |
            reports/junit.xml
            artifacts/screenshots/
          if-no-files-found: warn

